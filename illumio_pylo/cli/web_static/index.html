<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pylo Web UI (experimental)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    .commands { margin-bottom: 20px; }
    .log { white-space: pre; background:#f5f5f5; padding:10px; border:1px solid #ddd; height:300px; overflow:auto }
    textarea.cli-preview { width: 100%; height: 80px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Pylo Web UI (experimental)</h1>
  <div class="commands">
    <h2>Available commands</h2>
    <ul id="commands"></ul>
  </div>
  <div id="command-form"></div>
  <div>
    <h3>CLI preview</h3>
    <div style="display:flex; gap:8px; align-items:flex-start;">
      <textarea id="cli-preview" class="cli-preview" readonly></textarea>
      <div>
        <button id="copy-cli">Copy CLI</button>
        <div id="copy-cli-status" style="color:green; margin-top:8px; display:none;">Copied!</div>
      </div>
    </div>
  </div>
  <div>
    <h3>Logs</h3>
    <div id="logs" class="log"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
