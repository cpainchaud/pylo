<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pylo Web UI</title>
  <script>
    (function() {
      const root = document.documentElement;
      if (!root) return;
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const applyTheme = isDark => root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      applyTheme(mediaQuery.matches);
      const listener = event => applyTheme(event.matches);
      if (mediaQuery.addEventListener) {
        mediaQuery.addEventListener('change', listener);
      } else if (mediaQuery.addListener) {
        mediaQuery.addListener(listener);
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Pylo Web UI</h1>

  <!-- Panel 1: Landing (command cards + search) -->
  <div id="panel-landing">
    <h2>Available commands</h2>
    <input id="command-search" placeholder="Search commands by name..." />
    <div class="cards" id="commands"></div>
  </div>

  <!-- Panel 2: Parameters & logs (hidden by default) -->
  <div id="panel-params" class="hidden" hidden>
    <div id="params-header">
      <button id="back-btn">⟵ Back</button>
      <div id="current-command-name">(no command)</div>
    </div>

    <div id="options-row">
      <div id="command-form"></div>
    </div>

    <div id="content-area">
      <div>
        <div class="section-heading">
          <h3>CLI preview</h3>
          <div class="heading-actions">
            <button id="copy-cli">Copy CLI</button>
            <div id="copy-cli-status">Copied!</div>
          </div>
        </div>
        <textarea id="cli-preview" class="cli-preview" readonly rows="2" data-command=""></textarea>
      </div>

      <div>
        <h3>Logs</h3>
        <div id="logs" class="log"></div>
      </div>
    </div>
  </div>

  <!-- panel-params is hidden by default via CSS; toggling uses body.params-visible -->

  <!-- In production the FastAPI app mounts static files under /static; use that path so
       this file works both with the real server and the mock server which also supports /static/ -->
  <script src="/static/app.js"></script>
</body>
</html>
